<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#ECE4D4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#451A03" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Outer Double Border (Editorial framing) -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#D7C9B1" stroke-width="1.5" rx="8"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#8B6F4E" stroke-width="0.75" stroke-dasharray="4 3" rx="4"/>

  <!-- Central Card -->
  <g filter="url(#shadow)">
    <rect x="90" y="90" width="1020" height="450" rx="16" fill="#FFFFFF" stroke="#E6DDCE" stroke-width="1.5"/>
  </g>

  <!-- Corner Ornament accents -->
  <path d="M 60 75 L 60 60 L 75 60" fill="none" stroke="#78350F" stroke-width="2"/>
  <path d="M 1140 75 L 1140 60 L 1125 60" fill="none" stroke="#78350F" stroke-width="2"/>
  <path d="M 60 555 L 60 570 L 75 570" fill="none" stroke="#78350F" stroke-width="2"/>
  <path d="M 1140 555 L 1140 570 L 1125 570" fill="none" stroke="#78350F" stroke-width="2"/>

  <!-- Top Badge -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#D97706"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#92400E" letter-spacing="1.5">SENTENCE ARCHIVE</text>
  </g>

  <!-- Title -->
  <text x="140" y="245" font-family="'Noto Serif KR', 'Batang', serif" font-size="52" font-weight="700" fill="#1C1917" letter-spacing="-1">문장서랍</text>
  <text x="350" y="242" font-family="'Newsreader', 'Georgia', serif" font-size="28" font-style="italic" fill="#78716C">Writing Seed &amp; Book Curator</text>

  <!-- Divider Line -->
  <line x1="140" y1="275" x2="1060" y2="275" stroke="#E7E5E4" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="140" y="325" font-family="'Noto Serif KR', 'Batang', serif" font-size="24" font-weight="500" fill="#44403C">
    "책의 목차가 없어도 괜찮습니다. 책이 될 글감을 무작위로 모으는 곳"
  </text>

  <!-- Feature Description -->
  <text x="140" y="370" font-family="'Noto Serif KR', sans-serif" font-size="16" fill="#78716C" letter-spacing="-0.3">
    좋은 문장 기록 · 실시간 음성 녹음 · AI 발전 인사이트 및 추천 테마 도출 · Google Sheets 자동 누적 저장
  </text>

  <!-- Feature Badges -->
  <g transform="translate(140, 425)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="38" rx="8" fill="#F5F5F4" stroke="#E7E5E4"/>
    <text x="65" y="24" text-anchor="middle" font-family="'Noto Serif KR', sans-serif" font-size="14" font-weight="600" fill="#292524">#무작위글감</text>

    <!-- Badge 2 -->
    <rect x="142" y="0" width="135" height="38" rx="8" fill="#F5F5F4" stroke="#E7E5E4"/>
    <text x="209" y="24" text-anchor="middle" font-family="'Noto Serif KR', sans-serif" font-size="14" font-weight="600" fill="#292524">#AI인사이트</text>

    <!-- Badge 3 -->
    <rect x="289" y="0" width="150" height="38" rx="8" fill="#F5F5F4" stroke="#E7E5E4"/>
    <text x="364" y="24" text-anchor="middle" font-family="'Noto Serif KR', sans-serif" font-size="14" font-weight="600" fill="#292524">#글감테마추천</text>

    <!-- Badge 4 -->
    <rect x="451" y="0" width="160" height="38" rx="8" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="531" y="24" text-anchor="middle" font-family="'Noto Serif KR', sans-serif" font-size="14" font-weight="600" fill="#92400E">#GoogleSheets연동</text>

    <!-- Badge 5 -->
    <rect x="623" y="0" width="145" height="38" rx="8" fill="#F5F5F4" stroke="#E7E5E4"/>
    <text x="695" y="24" text-anchor="middle" font-family="'Noto Serif KR', sans-serif" font-size="14" font-weight="600" fill="#292524">#AI목차기획안</text>
  </g>
</svg>
